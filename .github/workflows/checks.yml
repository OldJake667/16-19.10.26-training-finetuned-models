name: Notebook and published-result checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'nbformat>=5.10,<6'
      - name: Validate self-contained notebooks and saved results
        run: |
          python - <<'PY'
          import ast, csv, io, json
          from pathlib import Path
          import nbformat
          notebooks = sorted(Path('standalone_notebooks').glob('*.ipynb'))
          assert len(notebooks) == 10
          for path in notebooks:
              notebook = nbformat.read(path, as_version=4)
              nbformat.validate(notebook)
              for cell in notebook.cells:
                  if cell.cell_type != 'code':
                      continue
                  compile(cell.source, str(path), 'exec')
                  assert cell.execution_count is None and cell.outputs == []
                  for node in ast.walk(ast.parse(cell.source)):
                      if isinstance(node, ast.ImportFrom):
                          assert node.level == 0
                          assert (node.module or '').split('.')[0] not in ('lab_code', 'tools')
                      if isinstance(node, ast.Import):
                          assert all(item.name.split('.')[0] not in ('lab_code', 'tools') for item in node.names)
                      if isinstance(node, ast.Call) and isinstance(node.func, ast.Name):
                          assert node.func.id not in ('exec', 'eval', '__import__')
          summary = json.loads(Path('published_results/summary.json').read_text())
          for row in summary['runs']:
              folder = Path(row['run_directory'])
              history = json.loads((folder / 'history.json').read_text())
              status = json.loads((folder / 'snapshot_status.json').read_text())
              assert len(history) == row['epochs_completed'] == status['epochs_completed']
              assert row['status'] == status['status']
              if row['status'] != 'completed':
                  assert row['test_accuracy'] is None
                  assert not (folder / 'test_metrics.json').exists()
                  continue
              selected = json.loads((folder / 'training_validation_metrics.json').read_text())
              assert selected['epochs_completed'] == len(history)
              assert selected['selected_epoch'] == row['selected_epoch']
              metrics = json.loads((folder / 'test_metrics.json').read_text())
              predictions = list(csv.DictReader(io.StringIO((folder / 'test_predictions.csv').read_text())))
              assert len(predictions) == metrics['records'] == 3000
              accuracy = sum(r['label'] == r['prediction'] for r in predictions) / len(predictions)
              assert abs(accuracy - metrics['accuracy']) < 1e-12
              assert abs(accuracy - row['test_accuracy']) < 1e-12
          print('Validated 10 self-contained notebooks and all published result snapshots.')
          PY
